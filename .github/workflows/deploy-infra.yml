name: deploy-infra
on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: az deployment group what-if -g ${{ secrets.RG }} -f infra/main.bicep -p infra/main.bicepparam
      - name: Deploy
        run: az deployment group create -g ${{ secrets.RG }} -f infra/main.bicep -p infra/main.bicepparam
